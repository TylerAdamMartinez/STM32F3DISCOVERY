[package]
name = "STM32F3DISCOVERY"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.7", features = ["device"] }
embedded-hal = "1.0.0"
panic-halt = "1.0.0"
stm32f3xx-hal = { version = "0.10.0", features = ["stm32f303xc", "rt", "ld"] }


[profile.dev]
panic = 'abort'

[profile.release]
opt-level = 3
debug = false
lto = true
